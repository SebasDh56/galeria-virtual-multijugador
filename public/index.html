<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Acceso a la galería virtual 3D multijugador"
  >

  <title>Galería Virtual | Ingreso</title>

  <link rel="stylesheet" href="/css/login.css">
</head>

<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
      <a
        class="login-card__icon login-card__admin-access"
        href="/admin/login"
        aria-label="Acceso administrativo"
      >
        ◈
      </a>

      <p class="login-card__eyebrow">
        Experiencia virtual
      </p>

      <h1 id="login-title">
        Galería de Arte 3D
      </h1>

      <p class="login-card__description">
        Ingresa un nombre para acceder a la experiencia.
      </p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="nickname">
            Nombre de usuario
          </label>

          <input
            id="nickname"
            name="nickname"
            type="text"
            minlength="3"
            maxlength="20"
            autocomplete="nickname"
            placeholder="Ejemplo: Sebas"
            required
          >

          <small>
            Utiliza entre 3 y 20 caracteres.
          </small>
        </div>

        <fieldset class="avatar-customizer">
          <legend>Personaliza tu avatar</legend>

          <div class="avatar-type-options">
            <label class="avatar-type-option">
              <input
                type="radio"
                name="avatarType"
                value="male"
                checked
              >
              <span>
                <strong>Hombre</strong>
                <small>Cabello corto</small>
              </span>
            </label>

            <label class="avatar-type-option">
              <input
                type="radio"
                name="avatarType"
                value="female"
              >
              <span>
                <strong>Mujer</strong>
                <small>Cabello largo</small>
              </span>
            </label>
          </div>

          <label class="avatar-color" for="avatar-color">
            <span>
              <strong>Color de ropa</strong>
              <small>Elige el color que verán los demás.</small>
            </span>

            <input
              id="avatar-color"
              name="avatarColor"
              type="color"
              value="#c8102e"
              aria-label="Color de ropa del avatar"
            >
          </label>
        </fieldset>

        <p
          id="form-error"
          class="form-error"
          role="alert"
          aria-live="polite"
        ></p>

        <button type="submit">
          Ingresar a la galería
        </button>
      </form>
    </section>
  </main>

  <script src="/js/login.js"></script>
</body>
</html>
