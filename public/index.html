<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Acceso a la galería virtual 3D multijugador"
  >

  <title>Galería Virtual | Ingreso</title>

  <link rel="stylesheet" href="/css/login.css">
</head>

<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
      <div class="login-card__icon" aria-hidden="true">
        ◈
      </div>

      <p class="login-card__eyebrow">
        Experiencia virtual
      </p>

      <h1 id="login-title">
        Galería de Arte 3D
      </h1>

      <p class="login-card__description">
        Ingresa un nombre para acceder a la experiencia.
      </p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="nickname">
            Nombre de usuario
          </label>

          <input
            id="nickname"
            name="nickname"
            type="text"
            minlength="3"
            maxlength="20"
            autocomplete="nickname"
            placeholder="Ejemplo: Sebas"
            required
          >

          <small>
            Utiliza entre 3 y 20 caracteres.
          </small>
        </div>

        <p
          id="form-error"
          class="form-error"
          role="alert"
          aria-live="polite"
        ></p>

        <button type="submit">
          Ingresar a la galería
        </button>
      </form>
    </section>
  </main>

  <script src="/js/login.js"></script>
</body>
</html>
